<!DOCTYPE html>
<html lang="hr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>TerenRad - Sustav Mjerenja</title>
  
  <script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-app-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-firestore-compat.js"></script>

  <style>
    :root {
      --bg-dark: #0b1120;
      --panel-dark: #151f38;
      --card-dark: #1e294b;
      --border-color: #2e3d66;
      --accent: #2563eb;
      --accent-hover: #1d4ed8;
      --text-main: #f8fafc;
      --text-muted: #94a3b8;
      --danger: #ef4444;
      --warning: #f59e0b;
    }

    * { box-sizing: border-box; margin: 0; padding: 0; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; -webkit-tap-highlight-color: transparent; }
    body { background-color: var(--bg-dark); color: var(--text-main); min-height: 100vh; display: flex; flex-direction: column; }
    
    header { background-color: var(--panel-dark); border-bottom: 1px solid var(--border-color); padding: 12px 16px; display: flex; justify-content: space-between; align-items: center; position: sticky; top: 0; z-index: 100; }
    .logo { font-size: 17px; font-weight: bold; letter-spacing: 0.5px; }
    .logo span { color: #38bdf8; }
    
    .view-toggle { display: flex; background: var(--bg-dark); padding: 3px; border-radius: 8px; border: 1px solid var(--border-color); gap: 4px; }
    .view-toggle button { background: none; border: none; color: var(--text-muted); padding: 6px 12px; border-radius: 6px; font-weight: 600; font-size: 12px; cursor: pointer; }
    .view-toggle button.active { background: var(--accent); color: white; }

    .main-container { flex: 1; display: flex; width: 100%; position: relative; }

    /* Monter unos */
    #monter-view { width: 100%; max-width: 650px; margin: 0 auto; padding: 16px; display: none; }
    #monter-view.active { display: block; }
    .card { background: var(--panel-dark); border: 1px solid var(--border-color); border-radius: 12px; padding: 16px; margin-bottom: 16px; }
    .form-group { margin-bottom: 12px; }
    label { display: block; font-size: 11px; font-weight: 600; color: var(--text-muted); margin-bottom: 6px; text-transform: uppercase; }
    input, textarea { width: 100%; background: var(--bg-dark); border: 1px solid var(--border-color); color: white; padding: 10px 12px; border-radius: 8px; font-size: 14px; outline: none; }
    input:focus, textarea:focus { border-color: #38bdf8; }

    .upload-zone { border: 2px dashed var(--border-color); border-radius: 10px; padding: 20px; text-align: center; cursor: pointer; background: rgba(0,0,0,0.25); margin-bottom: 12px; }
    .upload-zone:active { border-color: var(--accent); }
    
    .preview-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(75px, 1fr)); gap: 8px; margin-bottom: 14px; }
    .preview-thumb { position: relative; width: 100%; height: 75px; border-radius: 6px; overflow: hidden; border: 1px solid var(--border-color); background: #000; }
    .preview-thumb img { width: 100%; height: 100%; object-fit: cover; }
    .btn-remove { position: absolute; top: 2px; right: 2px; background: var(--danger); color: white; border: none; border-radius: 50%; width: 20px; height: 20px; font-size: 11px; font-weight: bold; cursor: pointer; }

    .btn-submit { width: 100%; background: var(--accent); color: white; border: none; padding: 14px; border-radius: 8px; font-weight: bold; cursor: pointer; font-size: 14px; }
    .btn-submit:disabled { opacity: 0.5; }

    /* Admin & Pregled */
    #admin-view { width: 100%; display: none; }
    #admin-view.active { display: flex; }
    
    .sidebar { width: 320px; background: var(--panel-dark); border-right: 1px solid var(--border-color); display: flex; flex-direction: column; height: calc(100vh - 55px); }
    .sidebar-header { padding: 12px 14px; border-bottom: 1px solid var(--border-color); display: flex; justify-content: space-between; align-items: center; }
    .sidebar-list { flex: 1; overflow-y: auto; }
    .project-item { padding: 14px; border-bottom: 1px solid var(--border-color); cursor: pointer; }
    .project-item:active, .project-item:hover { background: var(--card-dark); }
    .project-item.selected { background: rgba(37,99,235,0.2); border-left: 4px solid var(--accent); }
    .project-item h4 { font-size: 14px; margin-bottom: 4px; }
    .project-item p { font-size: 11px; color: var(--text-muted); }

    .detail-panel { flex: 1; padding: 20px; overflow-y: auto; display: grid; grid-template-columns: 1fr 1fr; gap: 16px; align-content: start; height: calc(100vh - 55px); }
    .full-width { grid-column: span 2; display: flex; justify-content: space-between; align-items: center; border-bottom: 1px solid var(--border-color); padding-bottom: 12px; flex-wrap: wrap; gap: 8px; }

    .btn-mobile-back { display: none; background: var(--card-dark); color: white; border: 1px solid var(--border-color); padding: 8px 12px; border-radius: 6px; font-size: 12px; font-weight: bold; cursor: pointer; }
    .btn-action-group { display: flex; gap: 8px; }
    .btn-action { padding: 8px 12px; font-size: 12px; font-weight: bold; border-radius: 6px; border: none; cursor: pointer; }
    .btn-print { background: var(--accent); color: white; }
    .btn-delete { background: rgba(239, 68, 68, 0.2); color: #f87171; border: 1px solid rgba(239, 68, 68, 0.4); }

    .main-sketch { background: #000; border: 1px solid var(--border-color); border-radius: 8px; display: flex; align-items: center; justify-content: center; min-height: 350px; max-height: 480px; overflow: hidden; margin-bottom: 10px; }
    .main-sketch img { width: 100%; height: 100%; max-height: 480px; object-fit: contain; }
    .gallery-thumbs { display: flex; gap: 8px; overflow-x: auto; padding-bottom: 6px; }
    .gallery-thumb { width: 65px; height: 65px; flex-shrink: 0; border-radius: 6px; overflow: hidden; cursor: pointer; border: 2px solid transparent; opacity: 0.5; }
    .gallery-thumb.active { border-color: var(--accent); opacity: 1; }
    .gallery-thumb img { width: 100%; height: 100%; object-fit: cover; }

    table { width: 100%; border-collapse: collapse; font-size: 13px; margin-top: 10px; }
    th { text-align: left; padding: 8px; color: var(--text-muted); border-bottom: 1px solid var(--border-color); }
    td { padding: 10px 8px; border-bottom: 1px solid rgba(255,255,255,0.05); }

    /* iPhone & Mobilni prikaz */
    @media (max-width: 800px) {
      .main-container { display: block; }
      .sidebar { width: 100%; height: auto; min-height: calc(100vh - 55px); border-right: none; display: block; }
      .sidebar.mobile-hide { display: none; }
      
      .detail-panel { width: 100%; height: auto; min-height: calc(100vh - 55px); display: none; flex-direction: column; padding: 12px; }
      .detail-panel.mobile-show { display: flex; }
      .full-width { grid-column: span 1; }
      .btn-mobile-back { display: block; }
      .main-sketch { min-height: 280px; }
    }
  </style>
</head>
<body>

  <header>
    <div class="logo">TEREN<span>RAD</span></div>
    <div class="view-toggle">
      <button id="tab-monter" onclick="showMonterView()">➕ Novo</button>
      <button id="tab-admin" class="active" onclick="showAdminView()">📋 Nalozi</button>
    </div>
  </header>

  <div class="main-container">
    
    <!-- MONTER UNOS -->
    <div id="monter-view">
      <div class="card">
        <h3 style="margin-bottom: 12px; font-size: 16px;">Novo Mjerenje s Terena</h3>
        <form onsubmit="saveNewProject(event)">
          <label>Fotografije Skica / Bilježnice</label>
          <div class="upload-zone" onclick="document.getElementById('fileInput').click()">
            <span id="upload-status">📷 Dodaj slike (klikni ovdje)</span>
            <input type="file" id="fileInput" accept="image/*" multiple style="display:none" onchange="handleImageSelection(event)">
          </div>

          <div class="preview-grid" id="previewGrid"></div>

          <div class="form-group">
            <label>Naziv Klijenta / Objekt</label>
            <input type="text" id="cName" required placeholder="npr. Baldo Glumac">
          </div>

          <div style="display: flex; gap: 8px;">
            <div class="form-group" style="flex:1;">
              <label>Telefon</label>
              <input type="text" id="cPhone" placeholder="095...">
            </div>
            <div class="form-group" style="flex:1;">
              <label>Lokacija</label>
              <input type="text" id="cLoc" placeholder="npr. Grad">
            </div>
          </div>

          <div class="form-group">
            <label>Opće napomene</label>
            <textarea id="cNotes" rows="3" placeholder="RAL, profil, staklo..."></textarea>
          </div>

          <button type="submit" id="btnSubmit" class="btn-submit">💾 SPREMI I POŠALJI NALOG</button>
        </form>
      </div>
    </div>

    <!-- PREGLED NALOGA -->
    <div id="admin-view" class="active">
      <div class="sidebar" id="sidebar">
        <div class="sidebar-header">
          <span style="font-size: 12px; font-weight: bold; color: var(--text-muted);">SVI NALOZI</span>
          <button onclick="showMonterView()" style="background: var(--accent); color: white; border: none; padding: 4px 8px; border-radius: 5px; font-size: 11px; font-weight: bold; cursor: pointer;">+ Novo</button>
        </div>
        <div class="sidebar-list" id="projectList">
          <p style="padding: 20px; font-size: 12px; color: var(--text-muted); text-align: center;">Učitavanje s oblaka...</p>
        </div>
      </div>

      <div class="detail-panel" id="detailPanel">
        <div class="full-width">
          <div style="display: flex; align-items: center; gap: 10px;">
            <button onclick="backToSidebar()" class="btn-mobile-back">← Popis</button>
            <div>
              <h2 id="d-name" style="font-size: 18px;">-</h2>
              <p id="d-sub" style="font-size: 12px; color: var(--text-muted); margin-top: 2px;">-</p>
            </div>
          </div>
          <div class="btn-action-group">
            <button onclick="deleteCurrent()" class="btn-action btn-delete">🗑️ Izbriši</button>
            <button onclick="window.print()" class="btn-action btn-print">🖨️ Ispiši</button>
          </div>
        </div>

        <div class="card">
          <div style="display:flex; justify-content:space-between; align-items:center; margin-bottom: 8px;">
            <h4 style="color: #38bdf8; font-size: 13px;">Skice / Bilježnica</h4>
            <span id="d-page" style="font-size: 11px; color: var(--text-muted);">1 / 1</span>
          </div>
          <div class="main-sketch">
            <img id="d-img" src="" alt="Skica">
          </div>
          <div class="gallery-thumbs" id="d-thumbs"></div>
          <p id="d-notes" style="font-size: 12px; color: #f59e0b; margin-top: 8px;"></p>
        </div>

        <div class="card">
          <h4 style="margin-bottom: 8px; color: #38bdf8; font-size: 13px;">Specifikacija</h4>
          <table>
            <thead>
              <tr>
                <th>Br.</th>
                <th>Pozicija</th>
                <th>Širina</th>
                <th>Visina</th>
                <th>Napomena</th>
              </tr>
            </thead>
            <tbody id="d-table"></tbody>
          </table>
        </div>
      </div>
    </div>

  </div>

  <script>
    const firebaseConfig = {
      apiKey: "AIzaSyABrJCjpEBj6ZsXu4Or2TCTDvi1yQkAnVc",
      authDomain: "mjerenje-b0bc5.firebaseapp.com",
      projectId: "mjerenje-b0bc5",
      storageBucket: "mjerenje-b0bc5.firebasestorage.app",
      messagingSenderId: "923942715900",
      appId: "1:923942715900:web:86fb6c3a27694931a7fa2a"
    };

    firebase.initializeApp(firebaseConfig);
    const db = firebase.firestore();

    let projects = [];
    let selectedId = null;
    let currentImageIndex = 0;
    let uploadedImages = [];

    // Osluškivanje baze
    db.collection("nalozi").orderBy("timestamp", "desc").onSnapshot((snapshot) => {
      projects = [];
      snapshot.forEach(doc => {
        projects.push({ id: doc.id, ...doc.data() });
      });

      renderSidebar();

      if (projects.length > 0) {
        if (!selectedId || !projects.find(p => p.id === selectedId)) {
          if (window.innerWidth > 800) {
            openDetails(projects[0].id);
          }
        } else {
          renderDetails();
        }
      } else {
        selectedId = null;
        renderDetails();
      }
    });

    function renderSidebar() {
      const list = document.getElementById('projectList');
      if (projects.length === 0) {
        list.innerHTML = `<p style="padding: 20px; font-size: 12px; color: var(--text-muted); text-align: center;">Nema unesenih naloga.</p>`;
        return;
      }
      list.innerHTML = projects.map(p => `
        <div class="project-item ${p.id === selectedId ? 'selected' : ''}" onclick="openDetails('${p.id}')">
          <div style="display:flex; justify-content:space-between; align-items:center;">
            <h4>${p.name}</h4>
            <span style="background: rgba(245,158,11,0.2); color:#f59e0b; padding:2px 6px; border-radius:4px; font-size:10px; font-weight:bold;">NOVO</span>
          </div>
          <p>${p.loc || '-'} • ${p.date} • 📷 ${(p.images || []).length} str.</p>
        </div>
      `).join('');
    }

    function openDetails(id) {
      selectedId = id;
      currentImageIndex = 0;
      renderSidebar();
      renderDetails();

      if (window.innerWidth <= 800) {
        document.getElementById('sidebar').classList.add('mobile-hide');
        document.getElementById('detailPanel').classList.add('mobile-show');
      }
    }

    function backToSidebar() {
      document.getElementById('sidebar').classList.remove('mobile-hide');
      document.getElementById('detailPanel').classList.remove('mobile-show');
    }

    function renderDetails() {
      const p = projects.find(item => item.id === selectedId);
      if (!p) return;

      document.getElementById('d-name').innerText = p.name;
      document.getElementById('d-sub').innerText = `${p.loc || '-'} • ${p.phone || '-'} • Datum: ${p.date}`;
      document.getElementById('d-notes').innerText = p.notes ? 'Napomena: ' + p.notes : '';

      const images = (p.images && p.images.length > 0) ? p.images : [];
      currentImageIndex = Math.min(currentImageIndex, Math.max(0, images.length - 1));
      
      const mainImg = document.getElementById('d-img');
      if (images.length > 0) {
        mainImg.src = images[currentImageIndex];
        mainImg.style.display = 'block';
        document.getElementById('d-page').innerText = `Stranica ${currentImageIndex + 1} od ${images.length}`;
      } else {
        mainImg.style.display = 'none';
        document.getElementById('d-page').innerText = 'Nema slika';
      }

      const thumbs = document.getElementById('d-thumbs');
      if (images.length > 1) {
        thumbs.innerHTML = images.map((src, idx) => `
          <div class="gallery-thumb ${idx === currentImageIndex ? 'active' : ''}" onclick="selectThumb(${idx})">
            <img src="${src}">
          </div>
        `).join('');
      } else {
        thumbs.innerHTML = '';
      }

      const tbody = document.getElementById('d-table');
      const items = p.items || [{ num: 1, name: 'Mjere sa skice', w: '-', h: '-', note: 'Pogledati slike' }];
      tbody.innerHTML = items.map(it => `
        <tr>
          <td style="font-weight:bold; color:#38bdf8;">#${it.num}</td>
          <td style="font-weight:600;">${it.name}</td>
          <td style="font-weight:bold;">${it.w}</td>
          <td style="font-weight:bold;">${it.h}</td>
          <td style="color:#94a3b8;">${it.note}</td>
        </tr>
      `).join('');
    }

    function selectThumb(idx) {
      currentImageIndex = idx;
      renderDetails();
    }

    async function deleteCurrent() {
      const p = projects.find(item => item.id === selectedId);
      if (!p) return;
      if (confirm(`Izbrisati nalog: ${p.name}?`)) {
        await db.collection("nalozi").doc(selectedId).delete();
        backToSidebar();
      }
    }

    function showMonterView() {
      document.getElementById('monter-view').classList.add('active');
      document.getElementById('admin-view').classList.remove('active');
      document.getElementById('tab-monter').classList.add('active');
      document.getElementById('tab-admin').classList.remove('active');
    }

    function showAdminView() {
      document.getElementById('monter-view').classList.remove('active');
      document.getElementById('admin-view').classList.add('active');
      document.getElementById('tab-monter').classList.remove('active');
      document.getElementById('tab-admin').classList.add('active');
      backToSidebar();
    }

    // Mobilni kompresor prilagođen za iPhone kameru
    function compressFile(file) {
      return new Promise((resolve) => {
        const reader = new FileReader();
        reader.readAsDataURL(file);
        reader.onload = (e) => {
          const img = new Image();
          img.src = e.target.result;
          img.onload = () => {
            const canvas = document.createElement('canvas');
            const MAX = 600;
            let w = img.width;
            let h = img.height;

            if (w > h) {
              if (w > MAX) { h = Math.round((h * MAX) / w); w = MAX; }
            } else {
              if (h > MAX) { w = Math.round((w * MAX) / h); h = MAX; }
            }

            canvas.width = w;
            canvas.height = h;
            const ctx = canvas.getContext('2d');
            ctx.drawImage(img, 0, 0, w, h);
            resolve(canvas.toDataURL('image/jpeg', 0.4));
          };
        };
      });
    }

    async function handleImageSelection(e) {
      const files = Array.from(e.target.files);
      const status = document.getElementById('upload-status');
      
      for (let i = 0; i < files.length; i++) {
        status.innerText = `⏳ Obrađujem sliku ${i+1}/${files.length}...`;
        const base64 = await compressFile(files[i]);
        uploadedImages.push(base64);
      }
      
      renderPreviews();
      e.target.value = '';
    }

    function removeImage(idx) {
      uploadedImages.splice(idx, 1);
      renderPreviews();
    }

    function renderPreviews() {
      const grid = document.getElementById('previewGrid');
      grid.innerHTML = uploadedImages.map((src, i) => `
        <div class="preview-thumb">
          <img src="${src}">
          <button type="button" class="btn-remove" onclick="removeImage(${i})">✕</button>
        </div>
      `).join('');

      const count = uploadedImages.length;
      document.getElementById('upload-status').innerText = count > 0 
        ? `✅ Učitano stranica: ${count} (klikni za još)` 
        : '📷 Dodaj slike (klikni ovdje)';
    }

    async function saveNewProject(e) {
      e.preventDefault();
      const btn = document.getElementById('btnSubmit');
      btn.disabled = true;
      btn.innerText = 'Spremanje na oblak...';

      const d = new Date();
      const formattedDate = `${String(d.getDate()).padStart(2, '0')}.${String(d.getMonth()+1).padStart(2, '0')}.${d.getFullYear()}.`;

      const newProj = {
        name: document.getElementById('cName').value,
        phone: document.getElementById('cPhone').value || '-',
        loc: document.getElementById('cLoc').value || '-',
        date: formattedDate,
        timestamp: Date.now(),
        notes: document.getElementById('cNotes').value,
        images: [...uploadedImages],
        items: [
          { num: 1, name: 'Mjere sa skice', w: '-', h: '-', note: 'Pogledati slike' }
        ]
      };

      try {
        const docRef = await db.collection("nalozi").add(newProj);
        uploadedImages = [];
        renderPreviews();
        document.querySelector('form').reset();
        showAdminView();
        openDetails(docRef.id);
      } catch (err) {
        alert('Greška pri spremanju: ' + err.message);
      } finally {
        btn.disabled = false;
        btn.innerText = '💾 SPREMI I POŠALJI NALOG';
      }
    }
  </script>
</body>
</html>
