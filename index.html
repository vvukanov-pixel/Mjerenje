/* 1) POMOĆNE FUNKCIJE — dodaj oboje negdje u <script> */

async function savePins(nextPins) {
  const ref = db.collection("postavke").doc("pinovi");
  const snap = await ref.get();

  if (!snap.exists) {
    console.error("PIN dokument ne postoji — spremanje otkazano, PIN-ovi nisu dirani.");
    return false;
  }

  const prev = snap.data() || {};
  const prevPins = prev.pins || {};

  await ref.set(
    {
      pins: nextPins,
      lastModified: Date.now(),
      backup: prevPins,
      createdAt: prev.createdAt || Date.now(),
    },
    { merge: true }
  );

  return true;
}

async function initPins() {
  const ref = db.collection("postavke").doc("pinovi");
  try {
    const doc = await ref.get();
    if (!doc.exists) {
      await ref.set({
        pins: DEFAULT_PINS,
        createdAt: Date.now(),
        lastModified: Date.now(),
        backup: DEFAULT_PINS,
      });
      console.warn("PIN dokument nije postojao — napravljena jednokratna inicijalizacija.");
    }
  } catch (e) {
    console.error("initPins nije uspio, ništa nije zapisano:", e);
  }
}


/* 2) onSnapshot LISTENER — zamijeni cijeli postojeći blok */

db.collection("postavke").doc("pinovi").onSnapshot(doc => {
  if (doc.exists && doc.data().pins) {
    userPins = { ...doc.data().pins };
  } else if (!doc.exists) {
    console.error("PIN dokument 'postavke/pinovi' ne postoji ili je nedostupan — PIN-ovi NISU resetirani.");
  }
  populateUserDropdowns();
  renderPinTable();
  renderMonteriCheckboxes();
  checkWorkerAuth();
}, err => {
  console.error("Greška pri čitanju PIN-ova:", err);
});


/* 3) saveUserPinChange() — zamijeni cijelu funkciju */

async function saveUserPinChange() {
  const target = document.getElementById('pinTargetDropdown').value;
  const newPin = document.getElementById('newPinVal').value.trim();
  if (!newPin || newPin.length < 4) {
    alert('PIN mora imati najmanje 4 znamenke.');
    return;
  }

  const pins = { ...userPins };
  pins[target] = newPin;

  const ok = await savePins(pins);
  if (!ok) {
    alert('Greška: dokument PIN-ova nije pronađen. Promjena NIJE spremljena.');
    return;
  }

  alert(`✅ Uspješno postavljen novi PIN za: ${target} (${newPin})`);
  document.getElementById('newPinVal').value = '';
}


/* 4) addNewWorkerWithPin() — zamijeni cijelu funkciju */

async function addNewWorkerWithPin() {
  const name = document.getElementById('newWorkerName').value.trim().toUpperCase();
  const pin = document.getElementById('newWorkerPin').value.trim() || '1234';

  if (!name) {
    alert('Unesite ime.');
    return;
  }

  const pins = { ...userPins };
  pins[name] = pin;

  const ok = await savePins(pins);
  if (!ok) {
    alert('Greška: dokument PIN-ova nije pronađen. Novi radnik NIJE spremljen.');
    return;
  }

  document.getElementById('newWorkerName').value = '';
  document.getElementById('newWorkerPin').value = '';
  alert(`✅ Dodan: ${name} (PIN: ${pin})`);
}


/* 5) deleteWorker() — zamijeni cijelu funkciju */

async function deleteWorker(name) {
  if (!confirm(`Želite li obrisati radnika: ${name}?`)) return;

  const pins = { ...userPins };
  delete pins[name];

  const ok = await savePins(pins);
  if (!ok) {
    alert('Greška: dokument PIN-ova nije pronađen. Radnik NIJE obrisan.');
  }
}
