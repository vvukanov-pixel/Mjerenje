<!DOCTYPE html>
<html lang="hr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>TerenRad - Sustav Mjerenja</title>
  
  <script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-app-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-firestore-compat.js"></script>

  <style>
    :root {
      --bg-dark: #090d16;
      --panel-dark: #131b2e;
      --card-dark: #1b2640;
      --border-color: #2a3b61;
      --accent: #2563eb;
      --accent-hover: #1d4ed8;
      --text-main: #f8fafc;
      --text-muted: #94a3b8;
      --danger: #ef4444;
      --warning: #f59e0b;
    }

    * { box-sizing: border-box; margin: 0; padding: 0; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; }
    body { background-color: var(--bg-dark); color: var(--text-main); min-height: 100vh; display: flex; flex-direction: column; }
    
    header { background-color: var(--panel-dark); border-bottom: 1px solid var(--border-color); padding: 12px 24px; display: flex; justify-content: space-between; align-items: center; }
    .logo { font-size: 18px; font-weight: bold; letter-spacing: 0.5px; }
    .logo span { color: #38bdf8; }
    
    .view-toggle { display: flex; background: var(--bg-dark); padding: 4px; border-radius: 8px; border: 1px solid var(--border-color); gap: 4px; }
    .view-toggle button { background: none; border: none; color: var(--text-muted); padding: 6px 14px; border-radius: 6px; font-weight: 600; font-size: 13px; cursor: pointer; transition: 0.2s; }
    .view-toggle button.active { background: var(--accent); color: white; }

    .container { flex: 1; display: flex; overflow: hidden; }
    .view-container { width: 100%; display: none; }
    .view-container.active { display: flex; }

    #monter-view { max-width: 600px; margin: 20px auto; padding: 0 16px; flex-direction: column; overflow-y: auto; }
    .card { background: var(--panel-dark); border: 1px solid var(--border-color); border-radius: 12px; padding: 20px; box-shadow: 0 10px 25px -5px rgba(0,0,0,0.5); }
    .form-group { margin-bottom: 14px; }
    label { display: block; font-size: 12px; font-weight: 600; color: var(--text-muted); margin-bottom: 6px; text-transform: uppercase; }
    input, textarea { width: 100%; background: var(--bg-dark); border: 1px solid var(--border-color); color: white; padding: 10px 12px; border-radius: 8px; font-size: 14px; outline: none; }
    input:focus, textarea:focus { border-color: #38bdf8; }

    .upload-zone { border: 2px dashed var(--border-color); border-radius: 10px; padding: 20px; text-align: center; cursor: pointer; background: rgba(0,0,0,0.2); margin-bottom: 14px; }
    .upload-zone:hover { border-color: var(--accent); }
    
    .preview-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(80px, 1fr)); gap: 8px; margin-bottom: 14px; }
    .preview-thumb { position: relative; width: 100%; height: 80px; border-radius: 6px; overflow: hidden; border: 1px solid var(--border-color); }
    .preview-thumb img { width: 100%; height: 100%; object-fit: cover; }
    .btn-remove { position: absolute; top: 2px; right: 2px; background: var(--danger); color: white; border: none; border-radius: 50%; width: 20px; height: 20px; font-size: 11px; cursor: pointer; }

    .btn-submit { width: 100%; background: var(--accent); color: white; border: none; padding: 12px; border-radius: 8px; font-weight: bold; cursor: pointer; font-size: 15px; }
    .btn-submit:hover { background: var(--accent-hover); }
    .btn-submit:disabled { opacity: 0.5; cursor: not-allowed; }

    #admin-view { flex-direction: row; width: 100%; }
    .sidebar { width: 320px; background: var(--panel-dark); border-right: 1px solid var(--border-color); display: flex; flex-direction: column; }
    .sidebar-header { padding: 14px 16px; border-bottom: 1px solid var(--border-color); display: flex; justify-content: space-between; align-items: center; }
    .sidebar-list { flex: 1; overflow-y: auto; }
    .project-item { padding: 14px 16px; border-bottom: 1px solid var(--border-color); cursor: pointer; transition: 0.15s; }
    .project-item:hover { background: var(--card-dark); }
    .project-item.selected { background: rgba(37,99,235,0.15); border-left: 4px solid var(--accent); }
    .project-item h4 { font-size: 14px; margin-bottom: 4px; }
    .project-item p { font-size: 12px; color: var(--text-muted); }

    .main-panel { flex: 1; padding: 24px; overflow-y: auto; display: grid; grid-template-columns: 1fr 1fr; gap: 20px; }
    .full-width { grid-column: span 2; display: flex; justify-content: space-between; align-items: center; border-bottom: 1px solid var(--border-color); padding-bottom: 14px; }

    .btn-action-group { display: flex; gap: 8px; }
    .btn-action { padding: 8px 14px; font-size: 13px; font-weight: bold; border-radius: 6px; border: none; cursor: pointer; display: inline-flex; align-items: center; gap: 6px; }
    .btn-print { background: var(--accent); color: white; }
    .btn-delete { background: rgba(239, 68, 68, 0.15); color: #f87171; border: 1px solid rgba(239, 68, 68, 0.3); }
    .btn-delete:hover { background: var(--danger); color: white; }

    .gallery-container { display: flex; flex-direction: column; gap: 12px; }
    .main-sketch { background: #000; border: 1px solid var(--border-color); border-radius: 8px; display: flex; align-items: center; justify-content: center; min-height: 420px; max-height: 520px; overflow: hidden; }
    .main-sketch img { max-width: 100%; max-height: 520px; object-fit: contain; }
    .gallery-thumbs { display: flex; gap: 8px; overflow-x: auto; padding-bottom: 6px; }
    .gallery-thumb { width: 70px; height: 70px; flex-shrink: 0; border-radius: 6px; overflow: hidden; cursor: pointer; border: 2px solid transparent; opacity: 0.6; }
    .gallery-thumb.active { border-color: var(--accent); opacity: 1; }
    .gallery-thumb img { width: 100%; height: 100%; object-fit: cover; }

    table { width: 100%; border-collapse: collapse; font-size: 13px; margin-top: 10px; }
    th { text-align: left; padding: 8px; color: var(--text-muted); border-bottom: 1px solid var(--border-color); font-weight: 600; }
    td { padding: 10px 8px; border-bottom: 1px solid rgba(255,255,255,0.05); }
    .badge { padding: 3px 8px; border-radius: 12px; font-size: 11px; font-weight: bold; }
    .badge-novo { background: rgba(245, 158, 11, 0.2); color: var(--warning); border: 1px solid rgba(245, 158, 11, 0.3); }

    @media print {
      header, .sidebar, .btn-action-group, .view-toggle, .gallery-thumbs { display: none !important; }
      body { background: white !important; color: black !important; }
      .main-panel { display: block !important; }
      .card { border: none !important; box-shadow: none !important; color: black !important; }
      td, th { color: black !important; border-bottom: 1px solid #ccc !important; }
    }
  </style>
</head>
<body>

  <header>
    <div class="logo">TEREN<span>RAD</span></div>
    <div class="view-toggle">
      <button id="btn-monter" onclick="switchView('monter')">📱 Monter (Novo Mjerenje)</button>
      <button id="btn-admin" class="active" onclick="switchView('admin')">💻 Ured (Radni Nalozi)</button>
    </div>
  </header>

  <div class="container">
    
    <div id="monter-view" class="view-container">
      <div class="card">
        <h3 style="margin-bottom: 14px;">Novo Mjerenje s Terena</h3>
        <form onsubmit="handleFormSubmit(event)">
          <label>Fotografije Skica / Bilježnice (neograničeno)</label>
          <div class="upload-zone" onclick="document.getElementById('fileInput').click()">
            <span id="upload-status">📷 Dodaj stranicu bilježnice / skicu</span>
            <input type="file" id="fileInput" accept="image/*" multiple style="display:none" onchange="handleMultipleImages(event)">
          </div>

          <div class="preview-grid" id="previewGrid"></div>

          <div class="form-group">
            <label>Ime i prezime klijenta</label>
            <input type="text" id="clientName" required placeholder="npr. Josip Tomičić">
          </div>

          <div style="display: flex; gap: 10px;">
            <div class="form-group" style="flex:1;">
              <label>Telefon</label>
              <input type="text" id="clientPhone" placeholder="095...">
            </div>
            <div class="form-group" style="flex:1;">
              <label>Lokacija</label>
              <input type="text" id="clientLoc" placeholder="npr. Lapad">
            </div>
          </div>

          <div class="form-group">
            <label>Opće napomene</label>
            <textarea id="generalNotes" rows="3" placeholder="RAL 9010, pogled iznutra, pod -2cm..."></textarea>
          </div>

          <button type="submit" id="btnSubmit" class="btn-submit">SPREMI I POŠALJI NALOG</button>
        </form>
      </div>
    </div>

    <div id="admin-view" class="view-container active">
      <div class="sidebar">
        <div class="sidebar-header">
          <span style="font-size: 13px; font-weight: bold; color: var(--text-muted);">SVI NALOZI (OBLAK)</span>
          <button onclick="switchView('monter')" style="background: var(--accent); color: white; border: none; padding: 5px 10px; border-radius: 6px; font-size: 12px; font-weight: bold; cursor: pointer;">+ Novo</button>
        </div>
        <div class="sidebar-list" id="projectList">
          <p style="padding: 20px; font-size: 13px; color: var(--text-muted); text-align: center;">Učitavanje podataka...</p>
        </div>
      </div>

      <div class="main-panel" id="mainPanel" style="display: none;">
        <div class="full-width">
          <div>
            <h2 id="det-client-name" style="font-size: 22px;">-</h2>
            <p id="det-client-sub" style="font-size: 13px; color: var(--text-muted); margin-top: 4px;">-</p>
          </div>
          <div class="btn-action-group">
            <button onclick="deleteCurrentProject()" class="btn-action btn-delete">🗑️ Izbriši Nalog</button>
            <button onclick="window.print()" class="btn-action btn-print">🖨️ Ispiši Nalog</button>
          </div>
        </div>

        <div class="card gallery-container">
          <div style="display:flex; justify-content:space-between; align-items:center;">
            <h4 style="color: #38bdf8;">Skice / Bilježnica</h4>
            <span id="page-count" style="font-size: 12px; color: var(--text-muted);">1 / 1</span>
          </div>
          <div class="main-sketch">
            <img id="det-sketch" src="" alt="Skica">
          </div>
          <div class="gallery-thumbs" id="galleryThumbs"></div>
          <p id="det-notes" style="margin-top: 6px; font-size: 12px; color: #f59e0b;"></p>
        </div>

        <div class="card">
          <h4 style="margin-bottom: 10px; color: #38bdf8;">Specifikacija za Radionicu</h4>
          <table>
            <thead>
              <tr>
                <th>Br.</th>
                <th>Pozicija</th>
                <th>Širina (cm)</th>
                <th>Visina (cm)</th>
                <th>Napomena</th>
              </tr>
            </thead>
            <tbody id="det-table-body"></tbody>
          </table>
        </div>
      </div>
    </div>

  </div>

  <script>
    const firebaseConfig = {
      apiKey: "AIzaSyABrJCjpEBj6ZsXu4Or2TCTDvi1yQkAnVc",
      authDomain: "mjerenje-b0bc5.firebaseapp.com",
      projectId: "mjerenje-b0bc5",
      storageBucket: "mjerenje-b0bc5.firebasestorage.app",
      messagingSenderId: "923942715900",
      appId: "1:923942715900:web:86fb6c3a27694931a7fa2a"
    };

    firebase.initializeApp(firebaseConfig);
    const db = firebase.firestore();

    let projects = [];
    let selectedId = null;
    let currentImageIndex = 0;
    let monterUploadedImages = [];

    db.collection("nalozi").orderBy("timestamp", "desc").onSnapshot((snapshot) => {
      projects = [];
      snapshot.forEach((doc) => {
        projects.push({ id: doc.id, ...doc.data() });
      });

      if (projects.length > 0) {
        if (!selectedId || !projects.find(p => p.id === selectedId)) {
          selectedId = projects[0].id;
        }
      } else {
        selectedId = null;
      }

      renderSidebar();
      renderDetails();
    });

    function renderSidebar() {
      const list = document.getElementById('projectList');
      if (projects.length === 0) {
        list.innerHTML = `<p style="padding: 20px; font-size: 13px; color: var(--text-muted); text-align: center;">Nema otvorenih naloga.</p>`;
        return;
      }
      list.innerHTML = projects.map(p => `
        <div class="project-item ${p.id === selectedId ? 'selected' : ''}" onclick="selectProject('${p.id}')">
          <div style="display:flex; justify-content:space-between;">
            <h4>${p.name}</h4>
            <span class="badge badge-novo">NOVO</span>
          </div>
          <p>${p.loc} • ${p.date}</p>
        </div>
      `).join('');
    }

    function renderDetails() {
      const panel = document.getElementById('mainPanel');
      const p = projects.find(item => item.id === selectedId);

      if (!p) {
        panel.style.display = 'none';
        return;
      }
      panel.style.display = 'grid';

      document.getElementById('det-client-name').innerText = p.name;
      document.getElementById('det-client-sub').innerText = `${p.loc} • ${p.phone} • Datum: ${p.date}`;
      document.getElementById('det-notes').innerText = p.notes ? 'Napomena: ' + p.notes : '';

      const images = p.images && p.images.length > 0 ? p.images : ['https://images.unsplash.com/photo-1586075010923-2dd4570fb338?auto=format&fit=crop&w=1000&q=80'];
      currentImageIndex = Math.min(currentImageIndex, images.length - 1);
      
      document.getElementById('det-sketch').src = images[currentImageIndex];
      document.getElementById('page-count').innerText = `Stranica ${currentImageIndex + 1} od ${images.length}`;

      const thumbsContainer = document.getElementById('galleryThumbs');
      thumbsContainer.innerHTML = images.map((imgUrl, idx) => `
        <div class="gallery-thumb ${idx === currentImageIndex ? 'active' : ''}" onclick="setMainImage(${idx})">
          <img src="${imgUrl}" alt="Stranica ${idx + 1}">
        </div>
      `).join('');

      const tbody = document.getElementById('det-table-body');
      const items = p.items || [{ num: 1, name: 'Pozicija sa skice', w: '-', h: '-', note: 'Pogledati skicu' }];
      tbody.innerHTML = items.map(item => `
        <tr>
          <td style="font-weight:bold; color:#38bdf8;">#${item.num}</td>
          <td style="font-weight:600;">${item.name}</td>
          <td style="font-weight:bold; font-size:14px;">${item.w}</td>
          <td style="font-weight:bold; font-size:14px;">${item.h}</td>
          <td style="color:#94a3b8;">${item.note}</td>
        </tr>
      `).join('');
    }

    async function deleteCurrentProject() {
      const p = projects.find(item => item.id === selectedId);
      if (!p) return;
      
      if (confirm(`Sigurno želite trajno izbrisati radni nalog za: ${p.name}?`)) {
        try {
          await db.collection("nalozi").doc(selectedId).delete();
        } catch (err) {
          alert('Greška pri brisanju: ' + err.message);
        }
      }
    }

    function setMainImage(index) {
      currentImageIndex = index;
      renderDetails();
    }

    function selectProject(id) {
      selectedId = id;
      currentImageIndex = 0;
      renderSidebar();
      renderDetails();
    }

    function switchView(view) {
      document.getElementById('monter-view').classList.toggle('active', view === 'monter');
      document.getElementById('admin-view').classList.toggle('active', view === 'admin');
      document.getElementById('btn-monter').classList.toggle('active', view === 'monter');
      document.getElementById('btn-admin').classList.toggle('active', view === 'admin');
    }

    // Optimizirana kompresija kako bi sve stalo unutar limita
    function compressImage(file) {
      return new Promise((resolve) => {
        const reader = new FileReader();
        reader.readAsDataURL(file);
        reader.onload = (event) => {
          const img = new Image();
          img.src = event.target.result;
          img.onload = () => {
            const canvas = document.createElement('canvas');
            const MAX_DIM = 850;
            let width = img.width;
            let height = img.height;

            if (width > height) {
              if (width > MAX_DIM) {
                height = Math.round((height * MAX_DIM) / width);
                width = MAX_DIM;
              }
            } else {
              if (height > MAX_DIM) {
                width = Math.round((width * MAX_DIM) / height);
                height = MAX_DIM;
              }
            }

            canvas.width = width;
            canvas.height = height;
            const ctx = canvas.getContext('2d');
            ctx.drawImage(img, 0, 0, width, height);
            resolve(canvas.toDataURL('image/jpeg', 0.5));
          };
        };
      });
    }

    async function handleMultipleImages(e) {
      const files = Array.from(e.target.files);
      const status = document.getElementById('upload-status');
      status.innerText = '⏳ Obrađujem fotografije...';
      
      for (const file of files) {
        const compressed = await compressImage(file);
        monterUploadedImages.push(compressed);
      }
      renderMonterPreviews();
      e.target.value = '';
    }

    function removeMonterImage(index) {
      monterUploadedImages.splice(index, 1);
      renderMonterPreviews();
    }

    function renderMonterPreviews() {
      const grid = document.getElementById('previewGrid');
      grid.innerHTML = monterUploadedImages.map((src, i) => `
        <div class="preview-thumb">
          <img src="${src}">
          <button type="button" class="btn-remove" onclick="removeMonterImage(${i})">✕</button>
        </div>
      `).join('');
      
      const count = monterUploadedImages.length;
      document.getElementById('upload-status').innerText = count > 0 
        ? `✅ Učitano stranica: ${count} (klikni za još)` 
        : '📷 Dodaj stranicu bilježnice / skicu';
    }

    async function handleFormSubmit(e) {
      e.preventDefault();
      const submitBtn = document.getElementById('btnSubmit');
      submitBtn.disabled = true;
      submitBtn.innerText = 'Spremanje na oblak...';

      const d = new Date();
      const formattedDate = `${String(d.getDate()).padStart(2, '0')}.${String(d.getMonth()+1).padStart(2, '0')}.${d.getFullYear()}.`;

      const newProj = {
        name: document.getElementById('clientName').value,
        phone: document.getElementById('clientPhone').value || '-',
        loc: document.getElementById('clientLoc').value || '-',
        date: formattedDate,
        timestamp: Date.now(),
        notes: document.getElementById('generalNotes').value,
        images: monterUploadedImages.length > 0 ? [...monterUploadedImages] : ['https://images.unsplash.com/photo-1586075010923-2dd4570fb338?auto=format&fit=crop&w=1000&q=80'],
        items: [
          { num: 1, name: 'Pozicija 1 (sa skice)', w: '-', h: '-', note: 'Pogledati skice' }
        ]
      };

      try {
        await db.collection("nalozi").add(newProj);
        monterUploadedImages = [];
        renderMonterPreviews();
        document.querySelector('form').reset();
        switchView('admin');
      } catch (err) {
        alert('Greška pri spremanju u bazu: ' + err.message);
      } finally {
        submitBtn.disabled = false;
        submitBtn.innerText = 'SPREMI I POŠALJI NALOG';
      }
    }
  </script>
</body>
</html>
