<!DOCTYPE html>
<html lang="hr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>TerenRad</title>
  
  <script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-app-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-firestore-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-storage-compat.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/pdf.js/2.16.105/pdf.min.js"></script>
  <script>pdfjsLib.GlobalWorkerOptions.workerSrc = 'https://cdnjs.cloudflare.com/ajax/libs/pdf.js/2.16.105/pdf.worker.min.js';</script>

  <style>
    :root{--bg-dark:#0b1120;--panel-dark:#151f38;--card-dark:#1e294b;--border-color:#2e3d66;--accent:#2563eb;--text-main:#f8fafc;--text-muted:#94a3b8;--danger:#ef4444;--success:#10b981}
    *{box-sizing:border-box;margin:0;padding:0;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif;-webkit-tap-highlight-color:transparent}
    body{background:var(--bg-dark);color:var(--text-main);min-height:100vh;display:flex;flex-direction:column}
    header{background:var(--panel-dark);border-bottom:1px solid var(--border-color);padding:10px 16px;display:flex;justify-content:space-between;align-items:center;position:sticky;top:0;z-index:100}
    .logo{font-size:17px;font-weight:bold}.logo span{color:#38bdf8}
    .header-right{display:flex;align-items:center;gap:8px}
    .user-tag{background:#0284c7;color:#fff;padding:5px 10px;border-radius:6px;font-size:11px;font-weight:bold;cursor:pointer}
    .view-toggle{display:flex;background:var(--bg-dark);padding:3px;border-radius:8px;border:1px solid var(--border-color)}
    .view-toggle button{background:none;border:none;color:var(--text-muted);padding:6px 12px;border-radius:6px;font-weight:600;font-size:12px;cursor:pointer}
    .view-toggle button.active{background:var(--accent);color:#fff}
    .main-container{flex:1;display:flex;width:100%;position:relative}
    #monter-view{width:100%;max-width:650px;margin:0 auto;padding:16px;display:none}
    #monter-view.active{display:block}
    .card{background:var(--panel-dark);border:1px solid var(--border-color);border-radius:12px;padding:16px;margin-bottom:16px}
    .form-group{margin-bottom:12px}
    label{display:block;font-size:11px;font-weight:600;color:var(--text-muted);margin-bottom:5px;text-transform:uppercase}
    input,textarea{width:100%;background:var(--bg-dark);border:1px solid var(--border-color);color:#fff;padding:10px 12px;border-radius:8px;font-size:14px;outline:none}
    input:focus,textarea:focus{border-color:#38bdf8}
    .upload-zone{border:2px dashed #0284c7;border-radius:10px;padding:18px;text-align:center;cursor:pointer;background:rgba(2,132,199,.08);margin-bottom:12px}
    .preview-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(75px,1fr));gap:8px;margin-bottom:12px}
    .preview-thumb{position:relative;width:100%;height:75px;border-radius:6px;overflow:hidden;border:1px solid var(--border-color);background:#000}
    .preview-thumb img{width:100%;height:100%;object-fit:cover}
    .btn-remove{position:absolute;top:2px;right:2px;background:var(--danger);color:#fff;border:none;border-radius:50%;width:20px;height:20px;font-size:10px;font-weight:bold;cursor:pointer}
    .btn-submit{width:100%;background:var(--accent);color:#fff;border:none;padding:13px;border-radius:8px;font-weight:bold;cursor:pointer;font-size:14px}
    .btn-submit:disabled{opacity:.5}
    #admin-view{width:100%;display:none}#admin-view.active{display:flex}
    .sidebar{width:340px;background:var(--panel-dark);border-right:1px solid var(--border-color);display:flex;flex-direction:column;height:calc(100vh - 52px)}
    .sidebar-header{padding:12px 14px;border-bottom:1px solid var(--border-color);display:flex;flex-direction:column;gap:8px}
    .search-input{width:100%;background:var(--bg-dark);border:1px solid var(--border-color);color:#fff;padding:7px 10px;border-radius:6px;font-size:12px;outline:none}
    .filter-row{display:flex;flex-wrap:wrap;gap:4px}
    .filter-btn{background:var(--bg-dark);border:1px solid var(--border-color);color:var(--text-muted);padding:4px 8px;border-radius:5px;font-size:11px;font-weight:600;cursor:pointer}
    .filter-btn.active{background:var(--accent);color:#fff;border-color:var(--accent)}
    .sidebar-list{flex:1;overflow-y:auto}
    .project-item{padding:12px 14px;border-bottom:1px solid var(--border-color);cursor:pointer;border-left:4px solid #38bdf8}
    .project-item:hover{background:var(--card-dark)}.project-item.selected{background:rgba(37,99,235,.2)}
    .project-item h4{font-size:14px;margin-bottom:3px}.project-item p{font-size:11px;color:var(--text-muted)}
    .detail-panel{flex:1;padding:18px;overflow-y:auto;display:flex;flex-direction:column;gap:16px;height:calc(100vh - 52px)}
    .full-width{display:flex;justify-content:space-between;align-items:center;border-bottom:1px solid var(--border-color);padding-bottom:12px;flex-wrap:wrap;gap:8px}
    .btn-mobile-back{display:none;background:var(--card-dark);color:#fff;border:1px solid var(--border-color);padding:6px 10px;border-radius:6px;font-size:12px;font-weight:bold;cursor:pointer}
    .btn-action-group{display:flex;gap:8px}
    .btn-action{padding:7px 12px;font-size:12px;font-weight:bold;border-radius:6px;border:none;cursor:pointer}
    .btn-print{background:var(--accent);color:#fff}.btn-delete{background:rgba(239,68,68,.2);color:#f87171;border:1px solid rgba(239,68,68,.4)}
    .grid-five-col{display:grid;grid-template-columns:repeat(auto-fit,minmax(260px,1fr));gap:16px}
    .main-sketch{background:#000;border:1px solid var(--border-color);border-radius:8px;display:flex;align-items:center;justify-content:center;min-height:240px;max-height:360px;overflow:hidden;margin-bottom:8px;cursor:pointer}
    .main-sketch img{width:100%;height:100%;max-height:360px;object-fit:contain}
    .gallery-thumbs{display:flex;gap:8px;overflow-x:auto;padding-bottom:6px}
    .gallery-thumb{width:55px;height:55px;flex-shrink:0;border-radius:6px;overflow:hidden;cursor:pointer;border:2px solid transparent;opacity:.5;position:relative}
    .gallery-thumb.active{border-color:#38bdf8;opacity:1}
    .gallery-thumb img{width:100%;height:100%;object-fit:cover}
    .btn-del-thumb{position:absolute;top:1px;right:1px;background:var(--danger);color:#fff;border:none;border-radius:50%;width:18px;height:18px;font-size:10px;font-weight:bold;cursor:pointer}
    .doc-box{border:2px dashed var(--border-color);border-radius:8px;padding:18px;text-align:center;background:rgba(0,0,0,.2);min-height:160px;display:flex;flex-direction:column;align-items:center;justify-content:center}
    .doc-preview{width:100%;min-height:220px;max-height:360px;border-radius:6px;overflow:hidden;background:#000;display:flex;align-items:center;justify-content:center;margin-bottom:10px;cursor:pointer;border:1px solid var(--border-color)}
    .doc-preview img{width:100%;max-height:360px;object-fit:contain}
    .positions-box{background:var(--bg-dark);border:1px solid var(--border-color);border-radius:8px;padding:10px;margin-bottom:12px}
    .pos-item{display:flex;align-items:center;justify-content:space-between;background:var(--panel-dark);padding:8px 10px;border-radius:6px;margin-bottom:6px;border:1px solid rgba(255,255,255,.05);gap:6px}
    .pos-name{font-size:13px;font-weight:bold;flex:1;color:#fff}
    .status-chip{font-size:11px;padding:4px 8px;border-radius:5px;font-weight:bold;cursor:pointer;border:none}
    .chip-proizvodnja{background:rgba(245,158,11,.2);color:#fbbf24;border:1px solid rgba(245,158,11,.4)}
    .chip-skladiste{background:rgba(56,189,248,.2);color:#38bdf8;border:1px solid rgba(56,189,248,.4)}
    .chip-montirano{background:rgba(16,185,129,.2);color:#34d399;border:1px solid rgba(16,185,129,.4)}
    .monteri-container{display:flex;flex-direction:column;gap:6px;max-height:140px;overflow-y:auto;background:var(--bg-dark);border:1px solid var(--border-color);border-radius:8px;padding:8px;margin-bottom:10px}
    .monter-row{display:flex;align-items:center;justify-content:space-between;background:var(--panel-dark);padding:6px 10px;border-radius:6px;border:1px solid rgba(255,255,255,.05)}
    .monter-label{display:flex;align-items:center;gap:8px;font-size:12px;font-weight:600;cursor:pointer;margin:0;text-transform:none;color:#fff;flex:1}
    .monter-label input[type=checkbox]{width:16px;height:16px;margin:0;cursor:pointer;accent-color:#c084fc}
    .btn-del-worker{background:none;border:none;color:#f87171;cursor:pointer;font-size:12px;font-weight:bold;padding:2px 6px;border-radius:4px}
    .modal-overlay{position:fixed;inset:0;background:rgba(0,0,0,.85);display:flex;align-items:center;justify-content:center;z-index:200;padding:16px}
    .modal-box{background:var(--panel-dark);border:1px solid var(--border-color);border-radius:12px;padding:20px;width:100%;max-width:360px;text-align:center}
    .lightbox-overlay{position:fixed;inset:0;background:rgba(0,0,0,.95);z-index:300;display:none;flex-direction:column;align-items:center;justify-content:center;padding:16px}
    .lightbox-header{position:absolute;top:12px;right:16px;z-index:310}
    .btn-close-lightbox{background:var(--danger);color:#fff;border:none;padding:10px 18px;border-radius:8px;font-weight:bold;font-size:15px;cursor:pointer}
    .lightbox-content{width:100%;height:100%;display:flex;align-items:center;justify-content:center}
    .lightbox-img{max-width:95vw;max-height:88vh;object-fit:contain;border-radius:6px}
    @media(max-width:900px){.main-container{display:block}.sidebar{width:100%;height:auto;min-height:calc(100vh - 52px);border-right:none;display:block}.sidebar.mobile-hide{display:none}.detail-panel{width:100%;height:auto;min-height:calc(100vh - 52px);display:none;padding:12px}.detail-panel.mobile-show{display:flex}.btn-mobile-back{display:block}}
    @media print{header,.sidebar,.btn-action-group,.btn-mobile-back,.view-toggle,.user-tag,button,.upload-zone,input[type=file]{display:none!important}.main-container,#admin-view,.detail-panel{display:block!important;width:100%!important;height:auto!important}body{background:#fff;color:#000}}
  </style>
</head>
<body>
  <div id="lightbox" class="lightbox-overlay" onclick="closeLightbox(event)">
    <div class="lightbox-header"><button class="btn-close-lightbox" onclick="closeLightbox()">✕ ZATVORI</button></div>
    <div class="lightbox-content" id="lightboxContent"></div>
  </div>

  <div id="loginModal" class="modal-overlay" style="display:none">
    <div class="modal-box">
      <h3 style="margin-bottom:8px;font-size:17px">Prijava Korisnika</h3>
      <p style="font-size:12px;color:var(--text-muted);margin-bottom:14px">Unesite svoje ime:</p>
      <input type="text" id="modalWorkerInput" placeholder="npr. Administrator, Monter..." style="margin-bottom:14px;text-align:center;font-weight:bold">
      <button onclick="saveWorkerName()" class="btn-submit">POTVRDI</button>
    </div>
  </div>

  <header>
    <div class="logo">TEREN<span>RAD</span></div>
    <div class="header-right">
      <div class="user-tag" id="userBadge" onclick="promptChangeWorker()">👷 Prijava...</div>
      <div class="view-toggle">
        <button id="tab-monter" onclick="showMonterView()">➕ Novo</button>
        <button id="tab-admin" class="active" onclick="showAdminView()">📋 Nalozi</button>
      </div>
    </div>
  </header>

  <div class="main-container">
    <div id="monter-view">
      <div class="card">
        <h3 style="font-size:15px;margin-bottom:12px">Novo Terensko Mjerenje</h3>
        <form onsubmit="saveNewProject(event)">
          <label>Fotografije Skica / Mjerenja</label>
          <div class="upload-zone" onclick="document.getElementById('fileInput').click()">
            <span id="upload-status">📷 Dodaj stranice bilježnice</span>
            <input type="file" id="fileInput" accept="image/*,.pdf" multiple style="display:none" onchange="handleImageSelection(event)">
          </div>
          <div class="preview-grid" id="previewGrid"></div>
          <div class="form-group"><label>Klijent / Objekt</label><input type="text" id="cName" required placeholder="npr. ELLABO IND"></div>
          <div style="display:flex;gap:8px">
            <div class="form-group" style="flex:1"><label>Telefon</label><input type="text" id="cPhone" placeholder="095..."></div>
            <div class="form-group" style="flex:1"><label>Lokacija</label><input type="text" id="cLoc" placeholder="npr. Lapad"></div>
          </div>
          <div class="form-group"><label>Napomene</label><textarea id="cNotes" rows="3" placeholder="Boja, profil..."></textarea></div>
          <button type="submit" id="btnSubmit" class="btn-submit">💾 SPREMI MJERENJE</button>
        </form>
      </div>
    </div>

    <div id="admin-view" class="active">
      <div class="sidebar" id="sidebar">
        <div class="sidebar-header">
          <div style="display:flex;justify-content:space-between;align-items:center">
            <span style="font-size:12px;font-weight:bold;color:var(--text-muted)">SVI NALOZI</span>
            <button onclick="showMonterView()" style="background:var(--accent);color:#fff;border:none;padding:4px 8px;border-radius:5px;font-size:11px;font-weight:bold;cursor:pointer">+ Novo</button>
          </div>
          <input type="text" id="searchQuery" class="search-input" placeholder="🔍 Pretraži klijenta ili lokaciju..." oninput="renderSidebar()">
          <div class="filter-row">
            <button class="filter-btn active" data-filter="svi" onclick="setFilter('svi')">Svi</button>
            <button class="filter-btn" data-filter="proizvodnja" onclick="setFilter('proizvodnja')">U proizvodnji</button>
            <button class="filter-btn" data-filter="skladiste" onclick="setFilter('skladiste')">U skladištu</button>
            <button class="filter-btn" data-filter="montirano" onclick="setFilter('montirano')">Montirano</button>
            <button class="filter-btn" data-filter="fakturirano" onclick="setFilter('fakturirano')">Fakturirano</button>
          </div>
        </div>
        <div class="sidebar-list" id="projectList"><p style="padding:20px;
