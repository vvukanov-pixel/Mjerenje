<!DOCTYPE html>
<html lang="hr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>TerenRad - Sustav Mjerenja</title>
  
  <script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-app-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-firestore-compat.js"></script>

  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; font-family: -apple-system, BlinkMacSystemFont, sans-serif; }
    body { background: #0f172a; color: #f8fafc; padding-bottom: 50px; }
    
    .nav { background: #1e293b; padding: 12px 16px; display: flex; justify-content: space-between; align-items: center; border-bottom: 1px solid #334155; position: sticky; top: 0; z-index: 100; }
    .logo { font-size: 18px; font-weight: bold; color: #38bdf8; }
    .nav-btns button { background: #334155; color: #fff; border: none; padding: 8px 14px; border-radius: 6px; font-weight: bold; font-size: 13px; margin-left: 6px; cursor: pointer; }
    .nav-btns button.active { background: #0284c7; }

    .box { max-width: 800px; margin: 16px auto; padding: 0 12px; }
    .card { background: #1e293b; border: 1px solid #334155; border-radius: 10px; padding: 16px; margin-bottom: 16px; }

    label { display: block; font-size: 12px; font-weight: bold; color: #94a3b8; margin-bottom: 6px; text-transform: uppercase; }
    input, textarea { width: 100%; background: #0f172a; border: 1px solid #334155; color: white; padding: 12px; border-radius: 8px; font-size: 15px; margin-bottom: 12px; outline: none; }
    
    .btn-camera { background: #0369a1; border: 2px dashed #38bdf8; color: white; width: 100%; padding: 16px; border-radius: 8px; font-size: 15px; font-weight: bold; cursor: pointer; text-align: center; margin-bottom: 12px; display: block; }
    
    .grid-img { display: grid; grid-template-columns: repeat(auto-fill, minmax(80px, 1fr)); gap: 8px; margin-bottom: 12px; }
    .img-box { position: relative; width: 100%; height: 80px; border-radius: 6px; overflow: hidden; background: #000; border: 1px solid #475569; }
    .img-box img { width: 100%; height: 100%; object-fit: cover; }
    .img-del { position: absolute; top: 2px; right: 2px; background: #ef4444; color: white; border: none; border-radius: 50%; width: 22px; height: 22px; font-weight: bold; cursor: pointer; }

    .btn-save { width: 100%; background: #0284c7; color: white; border: none; padding: 15px; border-radius: 8px; font-weight: bold; font-size: 16px; cursor: pointer; }
    .btn-save:disabled { opacity: 0.5; }

    /* Popis naloga */
    .nalog-item { background: #1e293b; border: 1px solid #334155; border-radius: 8px; padding: 14px; margin-bottom: 10px; cursor: pointer; }
    .nalog-item:hover { border-color: #38bdf8; }
    .nalog-header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 4px; }
    .nalog-title { font-size: 16px; font-weight: bold; color: #f8fafc; }
    .nalog-badge { background: rgba(245, 158, 11, 0.2); color: #f59e0b; padding: 2px 6px; border-radius: 4px; font-size: 11px; font-weight: bold; }
    .nalog-sub { font-size: 13px; color: #94a3b8; }

    /* Detalj naloga */
    .detail-view { display: none; }
    .btn-back { background: #334155; color: white; border: none; padding: 8px 12px; border-radius: 6px; font-size: 13px; font-weight: bold; margin-bottom: 12px; cursor: pointer; }
    .big-img-container { width: 100%; min-height: 250px; max-height: 450px; background: #000; border-radius: 8px; overflow: hidden; display: flex; align-items: center; justify-content: center; margin-bottom: 10px; }
    .big-img-container img { width: 100%; max-height: 450px; object-fit: contain; }
    .thumbs-row { display: flex; gap: 8px; overflow-x: auto; padding-bottom: 8px; }
    .thumb-btn { width: 60px; height: 60px; flex-shrink: 0; border-radius: 6px; overflow: hidden; border: 2px solid transparent; opacity: 0.5; cursor: pointer; }
    .thumb-btn.active { border-color: #38bdf8; opacity: 1; }
    .thumb-btn img { width: 100%; height: 100%; object-fit: cover; }
    
    .btn-del-project { background: rgba(239,68,68,0.15); color: #f87171; border: 1px solid #ef4444; padding: 8px 12px; border-radius: 6px; font-weight: bold; cursor: pointer; float: right; }
  </style>
</head>
<body>

  <div class="nav">
    <div class="logo">TEREN<span>RAD</span></div>
    <div class="nav-btns">
      <button id="btnTabMonter" class="active" onclick="setTab('monter')">➕ NOVI NALOG</button>
      <button id="btnTabAdmin" onclick="setTab('admin')">📋 POPIS NALOGA</button>
    </div>
  </div>

  <div class="box">
    
    <!-- EKRAN 1: MONTER UNOS -->
    <div id="monterSec">
      <div class="card">
        <h3 style="margin-bottom: 12px;">Novo mjerenje s terena</h3>
        <form onsubmit="saveData(event)">
          
          <label>Fotografije skica / bilježnice</label>
          <label class="btn-camera" for="fileInp">
            <span id="txtStatus">📷 SLIKAJ ILI DODAJ IZ GALERIJE</span>
          </label>
          <input type="file" id="fileInp" accept="image/*" multiple style="display:none" onchange="readFiles(event)">

          <div class="grid-img" id="imgPreviews"></div>

          <label>Klijent / Objekt</label>
          <input type="text" id="inpName" required placeholder="npr. Baldo Glumac ili ELLABO">

          <div style="display: flex; gap: 8px;">
            <div style="flex:1;">
              <label>Telefon</label>
              <input type="text" id="inpPhone" placeholder="095...">
            </div>
            <div style="flex:1;">
              <label>Lokacija</label>
              <input type="text" id="inpLoc" placeholder="npr. Lapad">
            </div>
          </div>

          <label>Napomena</label>
          <textarea id="inpNotes" rows="3" placeholder="Boja, profil, staklo..."></textarea>

          <button type="submit" id="btnSubmit" class="btn-save">💾 SPREMI I POŠALJI NALOG</button>
        </form>
      </div>
    </div>

    <!-- EKRAN 2: LISTA SVIH NALOGA -->
    <div id="adminSec" style="display: none;">
      <div id="listSec">
        <div id="naloziList">
          <p style="text-align:center; color:#94a3b8; padding:30px;">Učitavanje s oblaka...</p>
        </div>
      </div>

      <!-- DETALJ NALOGA -->
      <div id="detailSec" class="detail-view">
        <button class="btn-back" onclick="backToList()">← Natrag na popis</button>
        <button class="btn-del-project" onclick="deleteItem()">🗑️ Izbriši nalog</button>
        
        <div class="card" style="clear: both; margin-top: 10px;">
          <h2 id="dName" style="font-size: 20px;">-</h2>
          <p id="dSub" style="color: #94a3b8; font-size: 13px; margin: 4px 0 14px;">-</p>

          <div style="display:flex; justify-content:space-between; margin-bottom:6px;">
            <span style="font-size: 12px; font-weight:bold; color:#38bdf8;">SKICE / BILJEŽNICA:</span>
            <span id="dPageCount" style="font-size: 12px; color:#94a3b8;">1/1</span>
          </div>

          <div class="big-img-container">
            <img id="dBigImg" src="" alt="Skica">
          </div>

          <div class="thumbs-row" id="dThumbs"></div>

          <p id="dNotes" style="color:#f59e0b; font-size: 13px; margin-top: 10px;"></p>
        </div>
      </div>
    </div>

  </div>

  <script>
    const firebaseConfig = {
      apiKey: "AIzaSyABrJCjpEBj6ZsXu4Or2TCTDvi1yQkAnVc",
      authDomain: "mjerenje-b0bc5.firebaseapp.com",
      projectId: "mjerenje-b0bc5",
      storageBucket: "mjerenje-b0bc5.firebasestorage.app",
      messagingSenderId: "923942715900",
      appId: "1:923942715900:web:86fb6c3a27694931a7fa2a"
    };

    firebase.initializeApp(firebaseConfig);
    const db = firebase.firestore();

    let allProjects = [];
    let curProj = null;
    let curImgIdx = 0;
    let myImages = [];

    // Osluškuj promjene u bazi
    db.collection("nalozi").orderBy("timestamp", "desc").onSnapshot(snap => {
      allProjects = [];
      snap.forEach(doc => {
        allProjects.push({ id: doc.id, ...doc.data() });
      });
      renderList();
      if (curProj) {
        const found = allProjects.find(p => p.id === curProj.id);
        if (found) { curProj = found; renderCurrentProject(); }
      }
    });

    function setTab(tab) {
      document.getElementById('monterSec').style.display = tab === 'monter' ? 'block' : 'none';
      document.getElementById('adminSec').style.display = tab === 'admin' ? 'block' : 'none';
      document.getElementById('btnTabMonter').className = tab === 'monter' ? 'active' : '';
      document.getElementById('btnTabAdmin').className = tab === 'admin' ? 'active' : '';
      if (tab === 'admin') backToList();
    }

    // Čitanje i sigurno smanjivanje slika
    function resizeFile(file) {
      return new Promise((resolve) => {
        const reader = new FileReader();
        reader.onload = function(e) {
          const img = new Image();
          img.onload = function() {
            const canvas = document.createElement('canvas');
            const MAX_WIDTH = 700;
            let w = img.width;
            let h = img.height;

            if (w > MAX_WIDTH) {
              h = Math.round((h * MAX_WIDTH) / w);
              w = MAX_WIDTH;
            }

            canvas.width = w;
            canvas.height = h;
            const ctx = canvas.getContext('2d');
            ctx.drawImage(img, 0, 0, w, h);
            resolve(canvas.toDataURL('image/jpeg', 0.45));
          };
          img.src = e.target.result;
        };
        reader.readAsDataURL(file);
      });
    }

    async function readFiles(e) {
      const files = Array.from(e.target.files);
      const txt = document.getElementById('txtStatus');
      txt.innerText = '⏳ Pripremam slike...';

      for (let f of files) {
        const b64 = await resizeFile(f);
        myImages.push(b64);
      }
      renderPreviews();
      e.target.value = '';
    }

    function removeImg(idx) {
      myImages.splice(idx, 1);
      renderPreviews();
    }

    function renderPreviews() {
      const g = document.getElementById('imgPreviews');
      g.innerHTML = myImages.map((src, i) => `
        <div class="img-box">
          <img src="${src}">
          <button type="button" class="img-del" onclick="removeImg(${i})">✕</button>
        </div>
      `).join('');
      
      document.getElementById('txtStatus').innerText = myImages.length > 0
        ? `✅ Dodano: ${myImages.length} slika (klikni za još)`
        : '📷 SLIKAJ ILI DODAJ IZ GALERIJE';
    }

    async function saveData(e) {
      e.preventDefault();
      const btn = document.getElementById('btnSubmit');
      btn.disabled = true;
      btn.innerText = 'Spremanje u oblak...';

      const d = new Date();
      const dateStr = `${d.getDate()}.${d.getMonth()+1}.${d.getFullYear()}.`;

      const data = {
        name: document.getElementById('inpName').value,
        phone: document.getElementById('inpPhone').value || '-',
        loc: document.getElementById('inpLoc').value || '-',
        notes: document.getElementById('inpNotes').value || '',
        date: dateStr,
        timestamp: Date.now(),
        images: [...myImages]
      };

      try {
        const doc = await db.collection("nalozi").add(data);
        myImages = [];
        renderPreviews();
        document.querySelector('form').reset();
        setTab('admin');
        openItem(doc.id);
      } catch (err) {
        alert('Greška pri spremanju: ' + err.message);
      } finally {
        btn.disabled = false;
        btn.innerText = '💾 SPREMI I POŠALJI NALOG';
      }
    }

    function renderList() {
      const container = document.getElementById('naloziList');
      if (allProjects.length === 0) {
        container.innerHTML = '<p style="text-align:center; color:#94a3b8; padding:30px;">Nema otvorenih naloga.</p>';
        return;
      }

      container.innerHTML = allProjects.map(p => `
        <div class="nalog-item" onclick="openItem('${p.id}')">
          <div class="nalog-header">
            <span class="nalog-title">${p.name}</span>
            <span class="nalog-badge">NOVO</span>
          </div>
          <div class="nalog-sub">📍 ${p.loc} &nbsp;•&nbsp; 📅 ${p.date} &nbsp;•&nbsp; 📷 ${(p.images || []).length} str.</div>
        </div>
      `).join('');
    }

    function openItem(id) {
      curProj = allProjects.find(p => p.id === id);
      if (!curProj) return;
      curImgIdx = 0;
      document.getElementById('listSec').style.display = 'none';
      document.getElementById('detailSec').style.display = 'block';
      renderCurrentProject();
    }

    function backToList() {
      document.getElementById('listSec').style.display = 'block';
      document.getElementById('detailSec').style.display = 'none';
      curProj = null;
    }

    function renderCurrentProject() {
      if (!curProj) return;
      document.getElementById('dName').innerText = curProj.name;
      document.getElementById('dSub').innerText = `Lokacija: ${curProj.loc} | Tel: ${curProj.phone} | Datum: ${curProj.date}`;
      document.getElementById('dNotes').innerText = curProj.notes ? 'Napomena: ' + curProj.notes : '';

      const imgs = curProj.images || [];
      const bigImg = document.getElementById('dBigImg');
      const thumbs = document.getElementById('dThumbs');
      const pageTxt = document.getElementById('dPageCount');

      if (imgs.length > 0) {
        bigImg.src = imgs[curImgIdx];
        bigImg.style.display = 'block';
        pageTxt.innerText = `${curImgIdx + 1} / ${imgs.length}`;

        thumbs.innerHTML = imgs.map((s, idx) => `
          <div class="thumb-btn ${idx === curImgIdx ? 'active' : ''}" onclick="setBigImage(${idx})">
            <img src="${s}">
          </div>
        `).join('');
      } else {
        bigImg.style.display = 'none';
        thumbs.innerHTML = '';
        pageTxt.innerText = 'Nema slika';
      }
    }

    function setBigImage(idx) {
      curImgIdx = idx;
      renderCurrentProject();
    }

    async function deleteItem() {
      if (!curProj) return;
      if (confirm(`Želite li sigurno izbrisati: ${curProj.name}?`)) {
        await db.collection("nalozi").doc(curProj.id).delete();
        backToList();
      }
    }
  </script>
</body>
</html>
